name: Keep Supabase awake

# Supabase free-tier projects pause after ~7 days of inactivity. Ping the backend's
# DB health endpoint every 2 days so the database always sees a real query.
on:
  schedule:
    - cron: '0 2 */2 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend DB health endpoint
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 30 --retry-all-errors \
            --max-time 120 \
            https://full-stack-application-development.onrender.com/health/db
